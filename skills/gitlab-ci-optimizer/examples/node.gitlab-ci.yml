# ==============================================================================
# Lean GitLab CI Pipeline Template: Node.js / TypeScript
# Designed for 2 GB / 2 vCPU Docker Runners
# Lean Score: 100/100
# ==============================================================================

# 1. Pipeline Deduplication: Run MR pipeline, skip branch pipeline if open MR exists
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# 2. Pipeline Defaults
default:
  image: $CI_REGISTRY_IMAGE/ci:latest
  interruptible: true                # Automatically cancel stale runs on new commit
  timeout: 15m                       # Terminate hung jobs quickly

# 3. Environment Variables & Runtime Memory Caps
variables:
  GIT_DEPTH: "20"                    # Shallow clone to minimize git checkout overhead
  # Global heap cap: ~75% of a 2GB runner (1536MB)
  NODE_OPTIONS: "--max-old-space-size=1536"

stages:
  - .pre                             # CI base image build (only on Dockerfile.ci change)
  - install                          # Install once
  - test                             # Parallel lint and unit tests
  - build                            # Production bundle build
  - e2e                              # End-to-end integration tests

# ==============================================================================
# Layer 1: Prebuilt CI Image (Eliminates image & OS tool setup tax)
# ==============================================================================
ci-image:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile.ci

# ==============================================================================
# Layer 2: Install Once, Sync Everywhere (Eliminates dependency install tax)
# ==============================================================================
install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push                # Only install job updates the cache
  artifacts:
    name: "deps-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
    expire_in: 1 hour                # Ephemeral: don't bloat server storage

# ==============================================================================
# Layer 3: The Job Work (Only pay for actual work on each push)
# ==============================================================================
lint:
  stage: test
  needs:
    - install
  script:
    - npm run lint
  rules:
    - changes:
        - src/**/*
        - package-lock.json
        - .gitlab-ci.yml

test:unit:
  stage: test
  needs:
    - install
  parallel: 2                        # Shard into 2 side-by-side jobs (match runner slots)
  variables:
    # Divide heap cap across workers (1536MB / (2 workers + 1) ~ 512MB)
    NODE_OPTIONS: "--max-old-space-size=512"
  script:
    # --maxWorkers=2 pins workers to runner vCPUs; --workerIdleMemoryLimit frees leaked memory
    - npx jest --maxWorkers=2 --workerIdleMemoryLimit=512MB --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  rules:
    - changes:
        - src/**/*
        - test/**/*
        - package-lock.json
        - .gitlab-ci.yml

build:
  stage: build
  needs:
    - install                        # Runs immediately once install finishes
  script:
    - npm run build
  artifacts:
    name: "dist-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/
    expire_in: 1 day                 # Fast expiration for non-release builds

# ==============================================================================
# Heavy E2E Suite: Off the push path (Nightly schedule or manual trigger)
# ==============================================================================
test:e2e:
  stage: e2e
  needs:
    - install
    - build
  script:
    - npx playwright test --workers=1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
