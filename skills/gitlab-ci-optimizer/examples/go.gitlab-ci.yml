# ==============================================================================
# Lean GitLab CI Pipeline Template: Go
# Designed for 2 GB / 2 vCPU Docker Runners
#
# Before first use:
#   1. Commit a Dockerfile.ci (tools only). The first pipeline must be a push to the
#      default branch that includes it: on any other ref ci:latest does not exist yet
#      and every job fails on image pull.
#   2. ci-image uses docker-in-docker, which needs a privileged runner. Give it a
#      dedicated runner; do not enable privileged mode on a shared one.
#   3. Protect the `ci` container repository (minimum push access: Maintainer) and
#      confirm on your GitLab version that the rule covers CI job tokens. Without it
#      any Developer can overwrite the image that protected pipelines run in.
# ==============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: $CI_REGISTRY_IMAGE/ci:latest
  interruptible: true
  timeout: 15m

variables:
  GIT_DEPTH: "20"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  # Soft limit per process: 75% of 2GB RAM / 2 test binaries (go test -p 2)
  GOMEMLIMIT: "768MiB"
  # Before Go 1.25 the runtime sizes itself to the host's cores, not the container's
  GOMAXPROCS: "2"

stages:
  - .pre
  - install
  - test
  - build
  - e2e

# ------------------------------------------------------------------------------
# Layer 1: Prebuilt CI Image (golang:1.23 + golangci-lint baked in)
# ------------------------------------------------------------------------------
ci-image:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  interruptible: false               # A cancelled build is never retried: later pushes do not touch Dockerfile.ci
  resource_group: ci-image           # One push of ci:latest at a time
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile.ci

# ------------------------------------------------------------------------------
# Layer 2: Download modules once
# ------------------------------------------------------------------------------
install:
  stage: install
  script:
    - go mod download
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
    policy: pull-push
  artifacts:
    name: "gomod-${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod/
    expire_in: 1 hour

# ------------------------------------------------------------------------------
# Layer 3: Test & Lint
# ------------------------------------------------------------------------------
lint:
  stage: test
  needs:
    - install
  script:
    - golangci-lint run --timeout=5m
  rules:
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - .gitlab-ci.yml

test:unit:
  stage: test
  needs:
    - install
  parallel: 2                        # Shard across runner slots
  script:
    # go test -p 2 caps parallel test binaries to 2 vCPUs; AWK partitions packages across shards
    - PKGS=$(go list ./... | awk "NR % $CI_NODE_TOTAL == ($CI_NODE_INDEX - 1)")
    - '[ -n "$PKGS" ] || { echo "no packages in this shard"; exit 0; }'
    - go test -v -p 2 -race $PKGS
  rules:
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - .gitlab-ci.yml

build:
  stage: build
  needs:
    - install
  script:
    - CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/ ./cmd/...
  artifacts:
    name: "bin-${CI_COMMIT_REF_SLUG}"
    paths:
      - bin/
    expire_in: 1 day

# Played more than an hour after its pipeline started, this needs `install` re-run first:
# the dependency artifact has expired by then.
test:e2e:
  stage: e2e
  needs:
    - install
    - build
  script:
    - go test -p 2 -tags=e2e ./test/e2e/...
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
