# ==============================================================================
# Lean GitLab CI Pipeline Template: Monorepo (Dynamic Parent-Child Pipeline)
# Runs isolated child pipelines ONLY for packages with changes
# ==============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  timeout: 15m

stages:
  - triggers

# ------------------------------------------------------------------------------
# Frontend Child Pipeline Trigger
# ------------------------------------------------------------------------------
frontend:
  stage: triggers
  trigger:
    include: frontend/.gitlab-ci.yml
    strategy: depend                 # Mirrors status of child pipeline to parent
  rules:
    - changes:
        - frontend/**/*

# ------------------------------------------------------------------------------
# Backend Service Child Pipeline Trigger
# ------------------------------------------------------------------------------
backend:
  stage: triggers
  trigger:
    include: backend/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - backend/**/*

# ------------------------------------------------------------------------------
# Shared Core Package Child Pipeline Trigger
# ------------------------------------------------------------------------------
packages-core:
  stage: triggers
  trigger:
    include: packages/core/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - packages/core/**/*
